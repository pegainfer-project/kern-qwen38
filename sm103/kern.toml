# The SM103 targets. Paths are relative to this file; `weights` entries are
# Hugging Face snapshot directories or single files, and the manifest's `bind`
# says which tensors go where.

gpu = 0

[kernels]
dumps   = ["dumped-kernels"]

[test]
seed = 0x5eed
decode_steps = 32
logit_kl = 0.01

[run]
prompt = "The capital of France is"
steps = 32

# Qwen3.8-27B (hybrid GDN + attention).
[targets."qwen3.8-27b"]
manifest  = "examples/qwen3.8-27b.json"
kernels   = "kernels-qwen38"
weights   = ["weights/Qwen3.8-27B"]

# With its DFlash2 draft (8-row rounds by default).
[targets."qwen3.8-27b-dflash2"]
manifest  = "examples/qwen3.8-27b-dflash2.json"
kernels   = "kernels-qwen38-dflash2"
weights   = ["weights/Qwen3.8-27B", "weights/Qwen3.8-27B-DFlash2"]
